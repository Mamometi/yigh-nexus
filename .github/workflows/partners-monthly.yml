# External partner records — monthly refresh (registry look-ups are cached for 30 days).
name: Partners monthly refresh

on:
  schedule:
    - cron: "0 13 1 * *"   # 1st of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: partners-db
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/partners -q
      - run: python -m backend.partners.run refresh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save database
        run: |
          git config user.name "yigh-radar-bot"
          git config user.email "yigh-radar-bot@users.noreply.github.com"
          git add data/partners.db
          git diff --cached --quiet || git commit -m "Partner records refresh $(date -u +%F)"
          git push
