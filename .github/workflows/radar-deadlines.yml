# Global Health Radar — daily lightweight deadline check (no discovery, no external requests).
name: Radar daily deadlines

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-db
  cancel-in-progress: false

jobs:
  deadlines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m backend.radar.run --mode deadlines
      - name: Save database
        run: |
          git config user.name "yigh-radar-bot"
          git config user.email "yigh-radar-bot@users.noreply.github.com"
          git add data/radar.db data/radar/
          git diff --cached --quiet || git commit -m "Radar deadline check $(date -u +%F)"
          git push
