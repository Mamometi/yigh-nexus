# Global Health Radar — weekly discovery (Mondays) + manual trigger.
# Runs the tests first, then the pipeline; commits the updated SQLite database and run summary.
name: Radar weekly discovery

on:
  schedule:
    - cron: "0 11 * * 1"   # Mondays 11:00 UTC (06:00/07:00 New Haven)
  workflow_dispatch:
    inputs:
      sources:
        description: "Optional comma-separated source ids (blank = all enabled sources)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: radar-db        # weekly and daily jobs never write the database at the same time
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests (fixtures, no network)
        run: python -m pytest tests -q
      - name: Discover opportunities
        run: |
          ARGS="--mode weekly"
          if [ -n "${{ github.event.inputs.sources }}" ]; then ARGS="$ARGS --sources ${{ github.event.inputs.sources }}"; fi
          python -m backend.radar.run $ARGS
      - name: Refresh team recommendations for new/changed opportunities (cached when unchanged)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; without it the rule-based matcher is used
        run: python -c "from backend.nexus.service import Matcher; import json; print(json.dumps(Matcher().refresh_after_radar_run()))" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save database and summary
        if: always()
        run: |
          git config user.name "yigh-radar-bot"
          git config user.email "yigh-radar-bot@users.noreply.github.com"
          git add data/radar.db data/radar/ data/nexus.db
          git diff --cached --quiet || git commit -m "Radar weekly discovery $(date -u +%F)"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-weekly-summary
          path: data/radar/last_weekly_run.*
